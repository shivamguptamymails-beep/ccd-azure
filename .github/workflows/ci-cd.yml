name: CI/CD - Predictive Maintenance

# On every push to main: run unit + model-quality tests, build the API and
# dashboard images, push both to Azure Container Registry, then re-apply
# Terraform so both Container Apps pick up the new tags - only if every prior
# stage passed. A failed post-deploy health check rolls both apps back to the
# tags that were running before this deploy. Pull requests run the tests only.
#
# The project lives in predictive-maintenance/, but GitHub only reads
# workflows from the repository root, so this file sits here and every job
# works inside that folder.

on:
  push:
    branches: [main]
    paths:
      - "predictive-maintenance/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "predictive-maintenance/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login to Azure (no stored secrets)
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a terraform apply

env:
  PROJECT_DIR: predictive-maintenance
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  API_IMAGE: predictive-maintenance-api
  UI_IMAGE: predictive-maintenance-ui

  # Terraform authenticates with the same OIDC identity as azure/login.
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  # terraform.tfvars is gitignored, so CI must pin every setting that differs
  # from variables.tf's defaults - otherwise an apply from CI would try to
  # rebuild the deployment in the default region with default scaling.
  TF_VAR_location: eastasia
  TF_VAR_cosmos_location: koreacentral
  TF_VAR_min_replicas: "0"
  TF_VAR_max_replicas: "10"
  TF_VAR_concurrent_requests_per_replica: "10"
  TF_VAR_model_version: v1
  TF_VAR_publisher_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_enable_api_management: "true"
  TF_VAR_enable_functions: "true"

jobs:
  test:
    name: Unit + model-quality tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements.txt

      - run: pip install -r requirements.txt

      # Gate 1: API contract (test_api.py) and the model's precision/recall/F1
      # floor on the held-out test set (test_model_quality.py). A retrained
      # model that regresses below the documented baseline fails here and
      # the pipeline stops - nothing below this job ever runs.
      - run: pytest tests/ -v

  build-and-push:
    name: Build & push images to ACR
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "$(echo $ACR_LOGIN_SERVER | cut -d. -f1)"

      - uses: docker/setup-buildx-action@v3

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}/frontend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.UI_IMAGE }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.UI_IMAGE }}:latest
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui

  deploy:
    name: Terraform apply (Azure Container Apps)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    outputs:
      previous_image_tag: ${{ steps.previous.outputs.image_tag }}
      previous_frontend_tag: ${{ steps.previous.outputs.frontend_tag }}
      fqdn: ${{ steps.apply.outputs.fqdn }}
      dashboard_url: ${{ steps.apply.outputs.dashboard_url }}
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # keep `terraform output -raw` clean

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=predictive-maintenance.tfstate"

      # Captured BEFORE apply, so a failed smoke test later can roll back to
      # exactly what was running before this deploy.
      - id: previous
        run: |
          echo "image_tag=$(terraform output -raw current_image_tag 2>/dev/null || echo latest)" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$(terraform output -raw current_frontend_image_tag 2>/dev/null || echo latest)" >> "$GITHUB_OUTPUT"

      - id: apply
        run: |
          terraform apply -auto-approve -input=false \
            -var "image_tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -var "frontend_image_tag=${{ needs.build-and-push.outputs.image_tag }}"
          echo "fqdn=$(terraform output -raw container_app_fqdn)" >> "$GITHUB_OUTPUT"
          echo "dashboard_url=$(terraform output -raw dashboard_url)" >> "$GITHUB_OUTPUT"
          echo "function_app=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"
          echo "resource_group=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"

      # Function code ships as a zip; Azure installs requirements.txt (remote build).
      - name: Deploy notifier Function
        working-directory: ${{ env.PROJECT_DIR }}/functions
        run: |
          zip -r ../function.zip . -x ".venv/*" "__pycache__/*"
          az functionapp deployment source config-zip \
            -g "${{ steps.apply.outputs.resource_group }}" \
            -n "${{ steps.apply.outputs.function_app }}" \
            --src ../function.zip --build-remote true

  smoke-test:
    name: Post-deploy health check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Both apps scale to zero, so allow for a cold start (~1 min for the API).
      - name: API reports ready
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 60 "https://${{ needs.deploy.outputs.fqdn }}/ready"; then
              echo " Healthy."
              exit 0
            fi
            echo "Not ready yet, retrying in 10s..."
            sleep 10
          done
          echo "::error::API did not become healthy after deploy"
          exit 1

      - name: Prediction round trip
        run: |
          curl -fsS --max-time 60 -X POST "https://${{ needs.deploy.outputs.fqdn }}/predict" \
            -H "Content-Type: application/json" \
            -d '{"machine_id":"CI-SMOKE","Type":"M","Air temperature [K]":300,"Process temperature [K]":310,"Rotational speed [rpm]":1500,"Torque [Nm]":40,"Tool wear [min]":100}'

      - name: Dashboard reports healthy
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 60 "${{ needs.deploy.outputs.dashboard_url }}/_stcore/health"; then
              echo " Healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Dashboard did not become healthy after deploy"
          exit 1

  rollback:
    name: Roll back to previous images on failed health check
    needs: [deploy, smoke-test]
    if: failure() && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}/infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=predictive-maintenance.tfstate"
          terraform apply -auto-approve -input=false \
            -var "image_tag=${{ needs.deploy.outputs.previous_image_tag }}" \
            -var "frontend_image_tag=${{ needs.deploy.outputs.previous_frontend_tag }}"
